ichitaka <button type="button" id="rss-copy" class="rss-link" data-feed-url="https://yuemichi.github.io/diary/feed.xml" title="RSSのURLをコピー" aria-label="RSSのURLをコピー">RSS</button><span id="rss-copy-status" class="rss-status" role="status"></span><noscript>RSSのURL：https://yuemichi.github.io/diary/feed.xml</noscript></div></footer><script>(function () {

(function () {

  const stamp = t => Number.isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '--:--';
  document.querySelectorAll('.local-audio').forEach(card => {
    const audio = card.querySelector('audio'), controls = card.querySelector('.audio-controls');
    const toggle = card.querySelector('.audio-toggle'), seek = card.querySelector('.audio-seek');
    const time = card.querySelector('.audio-time'), status = card.querySelector('.audio-status');

    function update() {

    audio.addEventListener('error', () => { status.textContent = '音声を読み込めません。音声ファイルのリンクから開いてください。'; update(); });

}());</script><script>(function () {
